# Laptop mode: run the streaming job with Spark in local mode inside the driver
# container instead of on the standalone cluster (master + 2 workers).
#
#   docker compose -f docker-compose.yml -f docker-compose.laptop.yml up -d
#
# Same code and queries - only the executors move into the driver JVM, saving ~3 GB
# of RAM (three JVMs). It is also tuned for a few slow cores: fewer, larger
# micro-batches (the fixed per-batch cost of Delta commits, state checkpoints and
# planning otherwise dominates), 4 state partitions instead of 8, and a lower
# default event rate. Override with LAPTOP_PRODUCER_RATE / LAPTOP_TRIGGER_INTERVAL.
#
# Shuffle (state) partitions are fixed when a checkpoint is created, so switch
# modes on fresh volumes: docker compose down -v

services:
  spark-master:
    profiles: [cluster]
  spark-worker-1:
    profiles: [cluster]
  spark-worker-2:
    profiles: [cluster]

  pipeline:
    command: ["/opt/spark/bin/spark-submit",
              "--master", "local[4]",
              "--driver-memory", "2g",
              "--conf", "spark.sql.shuffle.partitions=4",
              "/opt/app/streaming/run_pipeline.py"]
    environment:
      STREAM_TRIGGER_INTERVAL: ${LAPTOP_TRIGGER_INTERVAL:-10 seconds}
      STREAM_SLOW_TRIGGER_INTERVAL: ${LAPTOP_SLOW_TRIGGER_INTERVAL:-30 seconds}
    depends_on: !override
      kafka-init:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

  producer:
    command: ["python", "-m", "producer.transaction_producer",
              "--rate", "${LAPTOP_PRODUCER_RATE:-100}", "--workers", "1"]

  reconcile:
    command: ["/opt/spark/bin/spark-submit",
              "--master", "local[2]",
              "--driver-memory", "1g",
              "/opt/app/batch/historical_reconciliation.py"]
    depends_on: !override {}
