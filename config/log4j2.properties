# Quiet Spark's INFO chatter; keep streaming and Delta warnings visible.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %p %c{1}: %m%n%ex

logger.streaming.name = org.apache.spark.sql.execution.streaming
logger.streaming.level = warn
logger.delta.name = org.apache.spark.sql.delta
logger.delta.level = warn
logger.kafka.name = org.apache.kafka
logger.kafka.level = error
logger.master.name = org.apache.spark.deploy
logger.master.level = info

# Expected, harmless notices for streaming queries (AQE is disabled per query automatically).
logger.rws.name = org.apache.spark.sql.execution.streaming.ResolveWriteToStream
logger.rws.level = error
logger.mbe.name = org.apache.spark.sql.execution.streaming.MicroBatchExecution
logger.mbe.level = error
