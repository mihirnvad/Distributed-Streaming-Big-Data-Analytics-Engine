# Cluster-wide Spark defaults, baked into the Spark image at /opt/spark/conf.
# Jobs only set what is truly job-specific; everything else lives here.

spark.master                                                         spark://spark-master:7077

# ---- Delta Lake
spark.sql.extensions                                                 io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                                      org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.databricks.delta.schema.autoMerge.enabled                      false
# Delta rebuilds table snapshots with 50 tasks by default - far too many for a
# 4-core cluster running 8 concurrent queries against small, frequently-committed tables.
spark.databricks.delta.snapshotPartitions                            4

# ---- Structured Streaming state: RocksDB keeps state off-heap (no GC pauses from
# millions of keys); changelog checkpointing uploads only the per-batch delta.
spark.sql.streaming.stateStore.providerClass                         org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider
spark.sql.streaming.stateStore.rocksdb.changelogCheckpointing.enabled true
spark.sql.streaming.minBatchesToRetain                               30
spark.sql.streaming.metricsEnabled                                   true

# ---- SQL engine
spark.sql.session.timeZone                                           UTC
spark.sql.shuffle.partitions                                         8
spark.sql.adaptive.enabled                                           true
spark.sql.execution.arrow.pyspark.enabled                            true
spark.serializer                                                     org.apache.spark.serializer.KryoSerializer

# ---- Scheduling: each medallion layer gets its own FAIR pool
spark.scheduler.mode                                                 FAIR
spark.scheduler.allocation.file                                      /opt/spark/conf/fairscheduler.xml

# ---- Resources (sized to fit the whole stack in an 8 GB Docker VM: 2 workers x 2 cores)
spark.driver.memory                                                  1g
spark.executor.memory                                                1g
spark.executor.cores                                                 2
spark.python.worker.reuse                                            true

# ---- Environment for executors and driver
spark.executorEnv.PYTHONPATH                                         /opt/app
spark.executorEnv.TZ                                                 UTC
spark.driver.extraJavaOptions                                        -Duser.timezone=UTC
spark.executor.extraJavaOptions                                      -Duser.timezone=UTC

spark.ui.showConsoleProgress                                         false
# A shared laptop CPU can starve heartbeat threads during catch-up bursts.
spark.network.timeout                                                300s
spark.executor.heartbeatInterval                                     20s
